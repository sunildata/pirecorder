{% extends "base.html" %}
{% block nav_files %}active{% endblock %}

{% block content %}
<div id="offline-badge" class="offline-badge">Reconnecting…</div>

<div class="card">
  <div class="field">
    <input type="search" id="search" placeholder="Search recordings…" autocomplete="off">
  </div>
  <div class="field-row" style="margin-bottom:0">
    <select id="sort">
      <option value="date">Newest first</option>
      <option value="name">Name</option>
      <option value="size">Largest</option>
      <option value="duration">Longest</option>
    </select>
    <select id="folder"><option value="">All days</option></select>
  </div>
</div>

<div class="card">
  <div class="stats">
    <div class="stat"><div class="stat-value" id="t-count">—</div><div class="stat-label">Files</div></div>
    <div class="stat"><div class="stat-value" id="t-size">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" id="t-hours">—</div><div class="stat-label">Hours</div></div>
    <div class="stat"><div class="stat-value" id="t-days">—</div><div class="stat-label">Days</div></div>
  </div>
</div>

<div class="card" id="bulk-bar" style="display:none">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <strong id="bulk-count" style="font-size:13px"></strong>
    <div style="flex:1"></div>
    <button class="btn btn-ghost btn-sm" id="bulk-zip">Download ZIP</button>
    <button class="btn btn-danger btn-sm" id="bulk-delete">Delete</button>
    <button class="btn btn-ghost btn-sm" id="bulk-clear">Clear</button>
  </div>
</div>

<div class="card">
  <div id="list"><div class="empty">Loading…</div></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/files.js') }}"></script>
{% endblock %}
