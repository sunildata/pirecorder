<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Audio Recorder</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --border: #2a2a38;
      --accent: #e53935;
      --accent-stop: #43a047;
      --text: #f0f0f5;
      --muted: #8888aa;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p  { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    /* ── Status badge ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.recording {
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,.6); }
      50%       { box-shadow: 0 0 0 7px rgba(229,57,53,0); }
    }

    #status-text { font-size: 0.95rem; font-weight: 600; }
    #timer       { margin-left: auto; font-size: 1.1rem; font-variant-numeric: tabular-nums; color: var(--muted); }
    #timer.active { color: var(--accent); font-weight: 700; }

    /* ── Label input ── */
    .label-row { margin-bottom: 16px; }
    .label-row label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 6px; }
    .label-row input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .label-row input:focus { border-color: var(--accent); }
    .label-row input:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Big record button ── */
    #rec-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }
    #rec-btn:active { transform: scale(0.97); }
    #rec-btn.idle    { background: var(--accent); color: #fff; }
    #rec-btn.active  { background: var(--accent-stop); color: #fff; }
    #rec-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Recordings list ── */
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    #recordings-list { display: flex; flex-direction: column; gap: 10px; }

    .rec-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rec-icon { font-size: 20px; flex-shrink: 0; }

    .rec-info { flex: 1; min-width: 0; }
    .rec-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .rec-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .icon-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
      cursor: pointer;
      color: var(--text);
      text-decoration: none;
      touch-action: manipulation;
      transition: background 0.15s;
    }
    .icon-btn:hover  { background: var(--border); }
    .icon-btn.danger:hover { background: rgba(229,57,53,.25); border-color: var(--accent); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
      font-size: 0.9rem;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      transition: transform 0.3s ease;
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">🎙</div>
  <div>
    <h1>Audio Recorder</h1>
    <p>Raspberry Pi · Event Recording</p>
  </div>
</header>

<!-- Control card -->
<div class="card">
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status-text">Ready</span>
    <span id="timer">00:00</span>
  </div>

  <div class="label-row">
    <label for="label-input">Recording label (optional)</label>
    <input id="label-input" type="text" placeholder="e.g. keynote, panel-1 …" maxlength="40" />
  </div>

  <button id="rec-btn" class="idle">
    <span id="btn-icon">⏺</span>
    <span id="btn-text">Start Recording</span>
  </button>
</div>

<!-- Recordings card -->
<div class="card">
  <div class="section-title">Saved Recordings</div>
  <div id="recordings-list"><div class="empty-state">No recordings yet.</div></div>
</div>

<div id="toast"></div>

<script>
  const socket = io();

  let isRecording = false;
  let timerInterval = null;
  let startTs = null;

  const dot        = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const timer      = document.getElementById("timer");
  const recBtn     = document.getElementById("rec-btn");
  const btnIcon    = document.getElementById("btn-icon");
  const btnText    = document.getElementById("btn-text");
  const labelInput = document.getElementById("label-input");
  const list       = document.getElementById("recordings-list");

  function fmtTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  }

  function applyStatus({ is_recording, duration }) {
    isRecording = is_recording;

    dot.className      = is_recording ? "dot recording" : "dot";
    statusText.textContent = is_recording ? "Recording …" : "Ready";
    timer.className    = is_recording ? "active" : "";
    timer.textContent  = fmtTime(duration || 0);

    recBtn.className   = is_recording ? "active" : "idle";
    btnIcon.textContent = is_recording ? "⏹" : "⏺";
    btnText.textContent = is_recording ? "Stop Recording" : "Start Recording";
    labelInput.disabled = is_recording;

    if (is_recording) {
      startTs = Date.now() - (duration || 0) * 1000;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTs) / 1000);
        timer.textContent = fmtTime(elapsed);
      }, 500);
    } else {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  socket.on("status", applyStatus);

  recBtn.addEventListener("click", async () => {
    recBtn.disabled = true;
    try {
      if (!isRecording) {
        const label = labelInput.value.trim();
        const res = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ label }),
        });
        const data = await res.json();
        if (!res.ok) return showToast(data.error || "Error");
        showToast("Recording started");
        labelInput.value = "";
      } else {
        const res = await fetch("/api/stop", { method: "POST" });
        const data = await res.json();
        if (!res.ok) return showToast(data.error || "Error");
        showToast("Saved: " + data.file);
        loadRecordings();
      }
    } finally {
      recBtn.disabled = false;
    }
  });

  async function loadRecordings() {
    const res  = await fetch("/api/recordings");
    const data = await res.json();
    if (!data.length) {
      list.innerHTML = '<div class="empty-state">No recordings yet.</div>';
      return;
    }
    list.innerHTML = data.map(r => `
      <div class="rec-item" id="rec-${CSS.escape(r.name)}">
        <div class="rec-icon">🎵</div>
        <div class="rec-info">
          <div class="rec-name">${r.name}</div>
          <div class="rec-meta">${r.size_kb} KB · WAV</div>
        </div>
        <div class="rec-actions">
          <a class="icon-btn" href="/api/download/${encodeURIComponent(r.name)}" download title="Download">⬇</a>
          <button class="icon-btn danger" onclick="deleteRec('${r.name.replace(/'/g, "\\'")}')" title="Delete">🗑</button>
        </div>
      </div>
    `).join("");
  }

  async function deleteRec(name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const res = await fetch(`/api/delete/${encodeURIComponent(name)}`, { method: "DELETE" });
    if (res.ok) { showToast("Deleted"); loadRecordings(); }
    else showToast("Delete failed");
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
  }

  // Poll recordings every 5s so other devices stay in sync
  loadRecordings();
  setInterval(loadRecordings, 5000);

  // Initial status sync
  fetch("/api/status").then(r => r.json()).then(applyStatus);
</script>
</body>
</html>
